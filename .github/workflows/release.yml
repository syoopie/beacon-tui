name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag, e.g. v0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Validate version
        run: |
          case "${{ inputs.version }}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "version must look like v1.2.3"; exit 1 ;;
          esac

      - name: Build binaries
        env:
          VERSION: ${{ inputs.version }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            out="dist/beacon_${os}_${arch}"
            echo "building $out"
            GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "$out" ./cmd/beacon
          done
          cd dist
          bins="beacon_darwin_amd64 beacon_darwin_arm64 beacon_linux_amd64 beacon_linux_arm64"
          for f in $bins; do
            sha256sum "$f" | tee "${f}.sha256"
          done
          sha256sum $bins > SHA256SUMS

      - name: Create tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            dist/beacon_* dist/SHA256SUMS
